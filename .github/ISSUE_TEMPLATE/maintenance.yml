name: Maintenance
description: Propose evidence-backed documentation, test or tooling maintenance.
body:
  - type: markdown
    attributes:
      value: Identify documentation, tests, fixtures or tooling and the affected file. Use synthetic
        spreadsheets; do not attach customer files. Preserve browser-local processing and state any
        limit of the evidence.
  - type: textarea
    id: evidence
    attributes:
      label: Problem and evidence
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and boundaries
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable acceptance criteria
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and source context
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation performed or planned
    validations:
      required: true
